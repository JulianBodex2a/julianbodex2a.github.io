<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de catálogo</title>
<style>
  :root{--bg:#0e1117;--card:#171b23;--line:#262c38;--tx:#e6e9ef;--mut:#8b93a3;--ac:#4f8cff;--bad:#e74c3c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--card)}
  header h1{margin:0;font-size:17px;font-weight:600}
  header .sp{margin-left:auto;display:flex;gap:10px}
  .wrap{max-width:1100px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:22px}
  label{display:block;font-size:13px;color:var(--mut);margin:0 0 5px}
  input,select{width:100%;padding:10px 12px;background:#0b0e14;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--ac)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .full{grid-column:1/-1}
  button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:#1e2430;color:var(--tx);font:inherit;cursor:pointer}
  button:hover{border-color:var(--ac)}
  button.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
  button.mini{padding:5px 10px;font-size:13px}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .thumb{width:44px;height:62px;object-fit:cover;border-radius:6px;background:#0b0e14}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
  .tag.serie{border-color:#3b5aa8;color:#8fb2ff}
  .tag.pelicula{border-color:#8a6a2b;color:#e0b871}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none;font-size:14px}
  .msg.ok{background:#12351f;border:1px solid #1e6b3a;color:#7ee2a8;display:block}
  .msg.err{background:#3a1414;border:1px solid #7a2b2b;color:#f0a0a0;display:block}
  #login{max-width:340px;margin:14vh auto}
  .row{display:flex;gap:8px;align-items:center}
  a{color:var(--ac)}
</style>
</head>
<body>

<div id="login" class="card">
  <h1 style="margin:0 0 16px;font-size:18px">Panel de catálogo</h1>
  <label>Clave</label>
  <input type="password" id="pw" placeholder="Contraseña del panel" autocomplete="current-password">
  <button class="primary" style="width:100%;margin-top:14px" onclick="login()">Entrar</button>
  <p id="loginerr" style="color:#f0a0a0;font-size:13px;margin:10px 0 0"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Panel de catálogo</h1>
    <div class="sp">
      <button onclick="window.open('index.html','_blank')">Ver web</button>
      <button onclick="copyM3U8()">Copiar URL m3u8</button>
      <button class="danger" onclick="logout()">Salir</button>
    </div>
  </header>

  <div class="wrap">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2 id="formtitle" style="margin:0 0 18px;font-size:16px">Añadir contenido</h2>
      <form id="form" onsubmit="return guardar(event)">
        <input type="hidden" id="id">
        <div class="grid">
          <div>
            <label>Tipo</label>
            <select id="type" onchange="toggleTipo()">
              <option value="serie">Serie</option>
              <option value="pelicula">Película</option>
            </select>
          </div>
          <div class="full">
            <label>Nombre de la serie o película</label>
            <input id="title" required placeholder="Ej: Shuirono Kamen">
          </div>
          <div class="full">
            <label>URL de la carátula</label>
            <input id="poster" placeholder="https://.../poster.jpg">
          </div>
          <div class="solo-serie">
            <label>Temporada</label>
            <input id="season" type="number" min="0" placeholder="1">
          </div>
          <div class="solo-serie">
            <label>Capítulo</label>
            <input id="episode" type="number" min="0" placeholder="1">
          </div>
          <div class="solo-serie full">
            <label>Nombre del capítulo (opcional)</label>
            <input id="epname" placeholder="Ej: El despertar">
          </div>
          <div class="full">
            <label>URL del vídeo en YourUpload</label>
            <input id="url" required placeholder="https://www.yourupload.com/watch/86KoXlemAt47">
          </div>
        </div>
        <div class="row" style="margin-top:18px">
          <button class="primary" type="submit">Guardar</button>
          <button type="button" onclick="resetForm()">Limpiar</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2 style="margin:0 0 14px;font-size:16px">Contenido publicado <span id="count" class="tag"></span></h2>
      <table>
        <thead><tr><th></th><th>Título</th><th>Tipo</th><th>Temp/Cap</th><th>Enlace</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://TU-HOST.com/api.php';
const APIHOST = 'https://TU-HOST.com';
let CACHE = [];

async function api(action, data, method) {
  method = method || 'POST';
  const r = await fetch(API + '?action=' + action, {
    method: method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: data ? JSON.stringify(data) : undefined
  });
  const txt = await r.text();
  try { return JSON.parse(txt); }
  catch (e) { return { error: 'Respuesta no valida: ' + txt.slice(0, 200) }; }
}

function flash(t, ok) {
  const m = document.getElementById('msg');
  m.textContent = t;
  m.className = 'msg ' + (ok === false ? 'err' : 'ok');
  setTimeout(function () { m.className = 'msg'; }, 4000);
}

function entrar() {
  document.getElementById('login').hidden = true;
  document.getElementById('app').hidden = false;
  toggleTipo();
  cargar();
}

async function login() {
  const r = await fetch(API + '?action=login', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'password=' + encodeURIComponent(document.getElementById('pw').value)
  }).then(function (x) { return x.json(); });

  if (r.ok) entrar();
  else document.getElementById('loginerr').textContent = r.error || 'Error';
}

async function logout() {
  await api('logout');
  location.reload();
}

function toggleTipo() {
  const esSerie = document.getElementById('type').value === 'serie';
  const bloques = document.querySelectorAll('.solo-serie');
  for (let i = 0; i < bloques.length; i++) bloques[i].style.display = esSerie ? '' : 'none';
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
}

async function cargar() {
  CACHE = await api('list', null, 'GET');
  if (!Array.isArray(CACHE)) CACHE = [];

  const tb = document.getElementById('rows');
  document.getElementById('count').textContent = CACHE.length + ' elementos';
  tb.innerHTML = '';

  CACHE.sort(function (a, b) {
    return a.title.localeCompare(b.title)
      || (a.season || 0) - (b.season || 0)
      || (a.episode || 0) - (b.episode || 0);
  });

  for (const it of CACHE) {
    const tr = document.createElement('tr');
    const tc = it.type === 'serie' ? 'serie' : 'pelicula';
    const tcLabel = it.type === 'serie' ? 'Serie' : 'Película';
    const ec = (it.season !== null && it.season !== undefined)
      ? 'S' + String(it.season).padStart(2, '0') + 'E' + String(it.episode).padStart(2, '0')
      : '—';

    tr.innerHTML =
      '<td><img class="thumb" src="' + esc(it.poster) + '" onerror="this.style.visibility=\'hidden\'"></td>' +
      '<td>' + esc(it.title) + (it.epname ? '<br><span style="color:#8b93a3;font-size:12px">' + esc(it.epname) + '</span>' : '') + '</td>' +
      '<td><span class="tag ' + tc + '">' + tcLabel + '</span></td>' +
      '<td>' + ec + '</td>' +
      '<td><a href="https://www.yourupload.com/watch/' + esc(it.slug) + '" target="_blank">' + esc(it.slug) + '</a></td>' +
      '<td style="white-space:nowrap">' +
        '<button class="mini" onclick="editar(\'' + it.id + '\')">Editar</button> ' +
        '<button class="mini danger" onclick="borrar(\'' + it.id + '\')">Borrar</button>' +
      '</td>';
    tb.appendChild(tr);
  }
}

async function guardar(e) {
  e.preventDefault();
  const id = document.getElementById('id').value;
  const data = {
    id: id,
    type: document.getElementById('type').value,
    title: document.getElementById('title').value.trim(),
    poster: document.getElementById('poster').value.trim(),
    season: document.getElementById('season').value,
    episode: document.getElementById('episode').value,
    epname: document.getElementById('epname').value.trim(),
    url: document.getElementById('url').value.trim()
  };
  const r = await api(id ? 'update' : 'add', data);
  if (r.ok) { flash(id ? 'Actualizado' : 'Añadido a la lista'); resetForm(); cargar(); }
  else flash(r.error || 'Error', false);
  return false;
}

function editar(id) {
  const it = CACHE.filter(function (x) { return x.id === id; })[0];
  if (!it) return;
  document.getElementById('id').value = it.id;
  document.getElementById('type').value = it.type;
  document.getElementById('title').value = it.title;
  document.getElementById('poster').value = it.poster || '';
  document.getElementById('season').value = (it.season === null || it.season === undefined) ? '' : it.season;
  document.getElementById('episode').value = (it.episode === null || it.episode === undefined) ? '' : it.episode;
  document.getElementById('epname').value = it.epname || '';
  document.getElementById('url').value = 'https://www.yourupload.com/watch/' + it.slug;
  document.getElementById('formtitle').textContent = 'Editando: ' + it.title;
  toggleTipo();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  document.getElementById('form').reset();
  document.getElementById('id').value = '';
  document.getElementById('formtitle').textContent = 'Añadir contenido';
  toggleTipo();
}

async function borrar(id) {
  if (!confirm('¿Borrar este elemento?')) return;
  await api('delete', { id: id });
  flash('Borrado');
  cargar();
}

function copyM3U8() {
  const u = APIHOST + '/lista.m3u8';
  navigator.clipboard.writeText(u);
  flash('URL copiada: ' + u);
}

api('me', null, 'GET').then(function (r) {
  if (r && r.auth) entrar();
});

document.getElementById('pw').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
