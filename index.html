<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<style>
  :root{--bg:#0e1117;--card:#171b23;--line:#262c38;--tx:#e6e9ef;--mut:#8b93a3;--ac:#4f8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sp{margin-left:auto;display:flex;gap:10px}
  .wrap{max-width:1200px;margin:0 auto;padding:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
  .item{cursor:pointer}
  .poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#0b0e14;border:1px solid var(--line);transition:.15s}
  .item:hover .poster{border-color:var(--ac);transform:translateY(-3px)}
  .cap{font-size:14px;font-weight:600;margin-top:9px}
  .sub{font-size:12px;color:var(--mut)}
  button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#1e2430;color:var(--tx);font:inherit;cursor:pointer}
  button:hover{border-color:var(--ac)}
  a{color:var(--ac)}
  dialog{border:none;background:transparent;padding:0;max-width:96vw;width:1000px}
  dialog::backdrop{background:rgba(0,0,0,.85)}
  .player{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  video{width:100%;display:block;background:#000;max-height:70vh}
  .phead{padding:14px 18px;display:flex;align-items:center;gap:12px}
  .phead .sp{margin-left:auto}
  .eps{padding:0 18px 18px;max-height:30vh;overflow:auto}
  .ep{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer}
  .ep:hover{background:#1e2430}
  .ep.on{background:#1e2a44;border:1px solid #2c4a86}
  .empty{color:var(--mut);text-align:center;padding:60px 0}
</style>
</head>
<body>
<header>
  <h1>Catálogo</h1>
  <div class="sp">
    <button onclick="abrirM3U8()">URL m3u8</button>
    <a href="admin.html"><button>Panel</button></a>
  </div>
</header>

<div class="wrap">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>No hay contenido todavía. Añádelo desde el panel.</div>
</div>

<dialog id="dlg">
  <div class="player">
    <video id="vid" controls playsinline></video>
    <div class="phead">
      <div>
        <div id="ptitle" style="font-weight:600"></div>
        <div id="psub" class="sub"></div>
      </div>
      <div class="sp">
        <button onclick="verEnVLC()">Abrir en VLC</button>
        <button onclick="document.getElementById('dlg').close();document.getElementById('vid').pause()">Cerrar</button>
      </div>
    </div>
    <div id="eps" class="eps"></div>
  </div>
</dialog>

<script>
const API = 'https://TU-HOST.com/api.php';
const APIHOST = 'https://TU-HOST.com';
let datos = [], actual = null;

function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

(async () => {
  datos = await fetch(API + '?action=list').then(r => r.json());
  const g = document.getElementById('grid');
  if (!datos.length) { document.getElementById('empty').hidden = false; return; }

  const grupos = {};
  for (const it of datos) (grupos[it.title] ||= []).push(it);

  for (const [titulo, lista] of Object.entries(grupos).sort((a,b)=>a[0].localeCompare(b[0]))) {
    lista.sort((a,b)=>(a.season??0)-(b.season??0)||(a.episode??0)-(b.episode??0));
    const esSerie = lista[0].type === 'serie';
    const d = document.createElement('div');
    d.className = 'item';
    d.onclick = () => abrir(titulo, lista);
    d.innerHTML =
      '<img class="poster" src="' + esc(lista[0].poster) + '" loading="lazy" onerror="this.style.opacity=.3">' +
      '<div class="cap">' + esc(titulo) + '</div>' +
      '<div class="sub">' + (esSerie ? lista.length + ' capítulo' + (lista.length>1?'s':'') : 'Película') + '</div>';
    g.appendChild(d);
  }
})();

function abrir(titulo, lista) {
  actual = lista[0];
  document.getElementById('ptitle').textContent = titulo;
  const e = document.getElementById('eps');
  e.innerHTML = '';
  if (lista[0].type === 'serie') {
    lista.forEach(it => {
      const div = document.createElement('div');
      div.className = 'ep';
      div.innerHTML = '<span class="sub" style="min-width:66px">S' + String(it.season).padStart(2,'0') + 'E' + String(it.episode).padStart(2,'0') + '</span>' +
                      '<span>' + esc(it.epname || 'Capítulo ' + it.episode) + '</span>';
      div.onclick = () => { [...e.children].forEach(c=>c.classList.remove('on')); div.classList.add('on'); play(it); };
      e.appendChild(div);
    });
    e.children[0].classList.add('on');
  }
  play(lista[0]);
  document.getElementById('dlg').showModal();
}

function play(it) {
  actual = it;
  document.getElementById('psub').textContent = it.epname || it.title;
  const v = document.getElementById('vid');
  v.src = API + '?action=stream&id=' + it.id;
  v.play().catch(()=>{});
}

function verEnVLC() {
  if (!actual) return;
  location.href = 'vlc://' + API + '?action=stream&id=' + actual.id;
}

function abrirM3U8() {
  const u = APIHOST + '/lista.m3u8';
  window.open(u);
  navigator.clipboard?.writeText(u);
}
</script>
</body>
</html>
